services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library-system-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - library-system-sqldata:/var/opt/mssql
    networks:
      - library-system-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    container_name: library-system-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=database,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;
    volumes:
      - ../../apps/api:/src
    depends_on:
      database:
        condition: service_healthy
    networks:
      - library-system-network

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.dev
    container_name: library-system-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:4200"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - library-system-network

volumes:
  library-system-sqldata:

networks:
  library-system-network:
    driver: bridge